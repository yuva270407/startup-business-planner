<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Management | Startup Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            color: #1e293b;
        }

        /* Navbar */

        .navbar {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);

            animation: navDown 0.6s ease;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 22px;
        }

        .nav-links a {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #2563eb;
            transform: translateY(-2px);
        }

        /* Main */

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 45px 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;

            animation: fadeUp 0.7s ease;
        }

        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #2563eb;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .heading h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #64748b;
        }

        /* Summary */

        .summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);

            transition: 0.3s;

            animation: fadeUp 0.8s ease;
        }

        .summary-card:hover {
            transform: translateY(-7px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .summary-icon {
            font-size: 32px;
        }

        .summary-card h2 {
            margin: 10px 0;
            color: #2563eb;
        }

        .summary-card p {
            color: #64748b;
        }

        /* Form */

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 16px;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);

            margin-bottom: 25px;

            animation: fadeUp 0.9s ease;
        }

        .form-card h2 {
            margin-bottom: 20px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 12px;
        }

        .form input,
        .form select {
            padding: 13px;

            border: 1px solid #dbe3ef;
            border-radius: 8px;

            outline: none;

            transition: 0.3s;
        }

        .form input:focus,
        .form select:focus {
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        .add-btn {
            border: none;
            border-radius: 8px;

            background: #2563eb;
            color: white;

            padding: 13px 20px;

            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-3px);
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        /* Expense list */

        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .expense-card {
            background: white;

            padding: 18px 20px;

            border-radius: 12px;

            display: flex;
            align-items: center;
            gap: 15px;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);

            animation: cardAppear 0.5s ease;

            transition: 0.3s;
        }

        .expense-card:hover {
            transform: translateX(6px);
        }

        .expense-icon {
            font-size: 30px;
        }

        .expense-info {
            flex: 1;
        }

        .expense-info h3 {
            margin-bottom: 5px;
        }

        .expense-info p {
            color: #64748b;
            font-size: 14px;
        }

        .amount {
            font-weight: bold;
            color: #dc2626;
            font-size: 18px;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;

            width: 36px;
            height: 36px;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.3s;
        }

        .delete-btn:hover {
            transform: scale(1.1);
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
            background: white;
            border-radius: 12px;
        }

        /* Animations */

        @keyframes navDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Mobile */

        @media (max-width: 750px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .heading h1 {
                font-size: 30px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .expense-card {
                flex-wrap: wrap;
            }

            .amount {
                margin-left: auto;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚀 Startup Planner
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="customers.html">Customers</a>
            <a href="expenses.html">Expenses</a>
            <a href="index.html">Home</a>
        </div>

    </nav>


    <main class="container">

        <div class="heading">

            <span class="badge">
                💸 BUSINESS EXPENSES
            </span>

            <h1>Expense Management</h1>

            <p>
                Track and manage your business expenses easily.
            </p>

        </div>


        <section class="summary">

            <div class="summary-card">

                <div class="summary-icon">
                    💰
                </div>

                <h2 id="totalExpense">
                    ₹0
                </h2>

                <p>
                    Total Expenses
                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    🧾
                </div>

                <h2 id="expenseCount">
                    0
                </h2>

                <p>
                    Total Entries
                </p>

            </div>

        </section>


        <section class="form-card">

            <h2>
                ➕ Add New Expense
            </h2>

            <div class="form">

                <input
                    type="text"
                    id="expenseName"
                    placeholder="Expense Name"
                >

                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Amount ₹"
                >

                <select id="expenseCategory">

                    <option value="">
                        Select Category
                    </option>

                    <option value="Rent">
                        Rent
                    </option>

                    <option value="Salary">
                        Salary
                    </option>

                    <option value="Marketing">
                        Marketing
                    </option>

                    <option value="Transport">
                        Transport
                    </option>

                    <option value="Electricity">
                        Electricity
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

                <button
                    class="add-btn"
                    onclick="addExpense()"
                >
                    Add
                </button>

            </div>

        </section>


        <section id="expenseList" class="expense-list">

        </section>

    </main>


    <script>

        function getExpenses() {

            return JSON.parse(
                localStorage.getItem("expenses")
            ) || [];

        }


        function saveExpenses(expenses) {

            localStorage.setItem(
                "expenses",
                JSON.stringify(expenses)
            );

        }


        function addExpense() {

            const name =
                document.getElementById("expenseName").value.trim();

            const amount =
                Number(
                    document.getElementById("expenseAmount").value
                );

            const category =
                document.getElementById("expenseCategory").value;


            if (!name || amount <= 0 || !category) {

                alert("Please enter all expense details.");

                return;

            }


            const expenses = getExpenses();


            expenses.push({

                id: Date.now(),

                name: name,

                amount: amount,

                category: category,

                date: new Date().toLocaleDateString()

            });


            saveExpenses(expenses);


            document.getElementById("expenseName").value = "";

            document.getElementById("expenseAmount").value = "";

            document.getElementById("expenseCategory").value = "";


            displayExpenses();

        }


        function deleteExpense(id) {

            const expenses = getExpenses();

            const updatedExpenses =
                expenses.filter(expense => expense.id !== id);

            saveExpenses(updatedExpenses);

            displayExpenses();

        }


        function displayExpenses() {

            const expenses = getExpenses();

            const list =
                document.getElementById("expenseList");


            list.innerHTML = "";


            let total = 0;


            expenses.forEach(expense => {

                total += Number(expense.amount);


                const card =
                    document.createElement("div");

                card.className = "expense-card";


                card.innerHTML = `

                    <div class="expense-icon">
                        💸
                    </div>

                    <div class="expense-info">

                        <h3>
                            ${expense.name}
                        </h3>

                        <p>
                            📁 ${expense.category}
                            &nbsp; • &nbsp;
                            📅 ${expense.date}
                        </p>

                    </div>

                    <div class="amount">
                        ₹${expense.amount}
                    </div>

                    <button
                        class="delete-btn"
                        onclick="deleteExpense(${expense.id})"
                    >
                        🗑️
                    </button>

                `;


                list.appendChild(card);

            });


            document.getElementById(
                "totalExpense"
            ).textContent = "₹" + total;


            document.getElementById(
                "expenseCount"
            ).textContent = expenses.length;


            if (expenses.length === 0) {

                list.innerHTML = `

                    <div class="empty">

                        🧾 No expenses added yet.

                        <br><br>

                        Add your first business expense above.

                    </div>

                `;

            }

        }


        displayExpenses();

    </script>

</body>

</html>
