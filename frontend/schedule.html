<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tomorrow Schedule | Startup Planner</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef5ff, #f8fbff);
            color: #1e293b;
        }

        .navbar {
            background: white;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
            animation: slideDown 0.6s ease;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #475569;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #2563eb;
            transform: translateY(-2px);
        }

        .container {
            max-width: 950px;
            margin: auto;
            padding: 45px 20px;
        }

        .heading {
            text-align: center;
            margin-bottom: 35px;
            animation: fadeUp 0.7s ease;
        }

        .badge {
            display: inline-block;
            background: #e0e7ff;
            color: #4f46e5;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .heading h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .heading p {
            color: #64748b;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            animation: fadeUp 0.8s ease;
            transition: 0.3s;
        }

        .summary-card:hover {
            transform: translateY(-7px);
        }

        .summary-icon {
            font-size: 30px;
        }

        .summary-card h2 {
            margin: 10px 0 5px;
            color: #2563eb;
        }

        .summary-card p {
            color: #64748b;
        }

        .form-card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.07);
            margin-bottom: 25px;
            animation: fadeUp 0.9s ease;
        }

        .form-card h2 {
            margin-bottom: 20px;
        }

        .form {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
        }

        .form input,
        .form select {
            padding: 13px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        .form input:focus,
        .form select:focus {
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        .add-btn {
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            padding: 13px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-3px);
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-card {
            background: white;
            padding: 18px 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
            animation: cardAppear 0.5s ease;
            transition: 0.3s;
        }

        .task-card:hover {
            transform: translateX(6px);
        }

        .task-card.completed {
            opacity: 0.65;
            background: #f0fdf4;
        }

        .task-check {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #16a34a;
        }

        .task-info {
            flex: 1;
        }

        .task-info h3 {
            margin-bottom: 6px;
        }

        .task-info p {
            color: #64748b;
            font-size: 14px;
        }

        .completed .task-info h3 {
            text-decoration: line-through;
        }

        .priority {
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
        }

        .high {
            background: #fee2e2;
            color: #dc2626;
        }

        .medium {
            background: #fef3c7;
            color: #d97706;
        }

        .low {
            background: #dcfce7;
            color: #16a34a;
        }

        .delete-btn {
            border: none;
            background: #fee2e2;
            color: #dc2626;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .delete-btn:hover {
            transform: scale(1.1);
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #64748b;
            background: white;
            border-radius: 12px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 750px) {

            .navbar {
                flex-direction: column;
                gap: 12px;
            }

            .summary {
                grid-template-columns: 1fr;
            }

            .form {
                grid-template-columns: 1fr;
            }

            .task-card {
                flex-wrap: wrap;
            }

            .heading h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚀 Startup Planner
        </div>

        <div class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="sales.html">Sales</a>
            <a href="expenses.html">Expenses</a>
            <a href="profit-loss.html">Profit & Loss</a>
            <a href="stock.html">Stock</a>
            <a href="schedule.html">Schedule</a>
            <a href="index.html">Home</a>
        </div>

    </nav>


    <main class="container">

        <div class="heading">

            <span class="badge">
                📅 TOMORROW'S PLAN
            </span>

            <h1>Tomorrow Schedule</h1>

            <p>
                Organize your business tasks for tomorrow.
            </p>

        </div>


        <section class="summary">

            <div class="summary-card">

                <div class="summary-icon">📋</div>

                <h2 id="totalTasks">0</h2>

                <p>Total Tasks</p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">✅</div>

                <h2 id="completedTasks">0</h2>

                <p>Completed</p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">⏳</div>

                <h2 id="pendingTasks">0</h2>

                <p>Pending</p>

            </div>

        </section>


        <section class="form-card">

            <h2>➕ Add Tomorrow's Task</h2>

            <div class="form">

                <input
                    type="text"
                    id="taskName"
                    placeholder="Task name"
                >

                <select id="priority">

                    <option value="High">
                        High Priority
                    </option>

                    <option value="Medium" selected>
                        Medium Priority
                    </option>

                    <option value="Low">
                        Low Priority
                    </option>

                </select>

                <button
                    class="add-btn"
                    onclick="addTask()"
                >
                    Add Task
                </button>

            </div>

        </section>


        <section
            id="taskList"
            class="task-list"
        ></section>

    </main>


    <script>

        function getTasks() {

            return JSON.parse(
                localStorage.getItem("tomorrowTasks")
            ) || [];

        }


        function saveTasks(tasks) {

            localStorage.setItem(
                "tomorrowTasks",
                JSON.stringify(tasks)
            );

        }


        function addTask() {

            const name =
                document.getElementById("taskName")
                    .value.trim();

            const priority =
                document.getElementById("priority").value;


            if (!name) {

                alert("Please enter a task.");

                return;

            }


            const tasks = getTasks();


            tasks.push({

                id: Date.now(),

                name: name,

                priority: priority,

                completed: false

            });


            saveTasks(tasks);


            document.getElementById("taskName").value = "";


            displayTasks();

        }


        function toggleTask(id) {

            const tasks = getTasks();


            const task =
                tasks.find(item => item.id === id);


            if (task) {

                task.completed =
                    !task.completed;

            }


            saveTasks(tasks);

            displayTasks();

        }


        function deleteTask(id) {

            const tasks = getTasks();


            const updatedTasks =
                tasks.filter(
                    task => task.id !== id
                );


            saveTasks(updatedTasks);

            displayTasks();

        }


        function displayTasks() {

            const tasks = getTasks();

            const list =
                document.getElementById("taskList");


            list.innerHTML = "";


            let completed = 0;


            tasks.forEach(task => {

                if (task.completed) {
                    completed++;
                }


                const card =
                    document.createElement("div");


                card.className =
                    "task-card" +
                    (task.completed
                        ? " completed"
                        : "");


                const priorityClass =
                    task.priority.toLowerCase();


                card.innerHTML = `

                    <input
                        type="checkbox"
                        class="task-check"
                        ${task.completed ? "checked" : ""}
                        onchange="toggleTask(${task.id})"
                    >

                    <div class="task-info">

                        <h3>
                            ${task.name}
                        </h3>

                        <p>
                            📅 Tomorrow
                        </p>

                    </div>

                    <span class="priority ${priorityClass}">
                        ${task.priority}
                    </span>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})"
                    >
                        🗑️
                    </button>

                `;


                list.appendChild(card);

            });


            const pending =
                tasks.length - completed;


            document.getElementById(
                "totalTasks"
            ).textContent = tasks.length;


            document.getElementById(
                "completedTasks"
            ).textContent = completed;


            document.getElementById(
                "pendingTasks"
            ).textContent = pending;


            if (tasks.length === 0) {

                list.innerHTML = `

                    <div class="empty">

                        📅 No tasks scheduled yet.

                        <br><br>

                        Add your first task above.

                    </div>

                `;

            }

        }


        displayTasks();

    </script>

</body>

</html>
